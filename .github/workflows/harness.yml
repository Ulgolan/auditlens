name: Harness

on:
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Smoke eval
        if: env.ANTHROPIC_API_KEY != ''
        run: npm run eval:smoke

      - name: Smoke eval skipped
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::warning::eval:smoke skipped — ANTHROPIC_API_KEY secret is not configured for this repository, so the smoke eval did not run."
